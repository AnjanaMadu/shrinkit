name: Release

on:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set build version
        id: version
        shell: pwsh
        run: echo "short_sha=$($env:GITHUB_SHA.Substring(0, 7))" >> $env:GITHUB_OUTPUT

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller --onefile --windowed --name Shrinkit-${{ steps.version.outputs.short_sha }} main.py

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ steps.version.outputs.short_sha }}
          name: Shrinkit build \#${{ steps.version.outputs.short_sha }}
          files: dist/Shrinkit-${{ steps.version.outputs.short_sha }}.exe
